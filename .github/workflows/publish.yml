name: Publish to Thunderstore

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name to publish (e.g. v1.0.2)'
        required: true
        default: 'v1.0.2'

jobs:
  publish:
    name: Upload to Thunderstore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Release Tag and Clean Version
        id: version_step
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.release_tag }}"
          # Remove leading 'v' if present for Thunderstore SemVer compatibility
          CLEAN_VER="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "Processing version: $CLEAN_VER (from tag $TAG)"

      - name: Download Release Asset ZIP
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ steps.version_step.outputs.tag }}
          fileName: '*.zip'
          out-file-path: 'downloaded_assets'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate Package ZIP
        id: find_zip
        run: |
          ZIP_FILE=$(find downloaded_assets -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No .zip package found in release assets!"
            exit 1
          fi
          echo "Found package zip: $ZIP_FILE"
          echo "zip_path=$ZIP_FILE" >> $GITHUB_OUTPUT

      - name: Upload Package to Thunderstore
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          token: ${{ secrets.THUNDERSTORE_TOKEN }}
          community: valheim
          namespace: ckforgame # Change this if your Thunderstore team name is different
          name: ExpandedPlayerInventory
          version: ${{ steps.version_step.outputs.clean_version }}
          description: "Expands player inventory rows with a built-in scrollbar and mouse-wheel scrolling support."
          file: ${{ steps.find_zip.outputs.zip_path }}
